# Reusable: builds the calling node repo to wasm and publishes ONLY node.json
# + the .wasm (a composite node's repo has no Cargo.toml, so only node.json).
# No secrets: the job's GitHub OIDC token proves which repository it runs in,
# and the gateway publishes for the node registered to that repo
# (`rapidboon init` registers it). The caller grants `id-token: write`:
#
#   jobs:
#     publish:
#       uses: Aeunal/framework-sdk/.github/workflows/publish-node.yml@main
#       permissions: { contents: read, id-token: write }
#       with: { gateway: https://admin-billing-gateway.onrender.com }   # add `path: <folder>` per endpoint
name: Publish node

on:
  workflow_call:
    inputs:
      gateway:
        description: Gateway URL, also the OIDC token audience
        type: string
        required: true
      path:
        description: The endpoint's folder in the repo (a multi-endpoint repo publishes each one)
        type: string
        default: .

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch framework publish tool
        uses: actions/checkout@v4
        with:
          repository: Aeunal/framework-sdk
          path: .fw-sdk

      - name: Build wasm
        if: hashFiles(format('{0}/Cargo.toml', inputs.path)) != ''
        working-directory: ${{ inputs.path }}
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release

      - name: Publish binary to registry
        env:
          FW_GATEWAY_URL: ${{ inputs.gateway }}
        working-directory: ${{ inputs.path }}
        run: python3 "$GITHUB_WORKSPACE/.fw-sdk/tools/fwpublish.py" node .
